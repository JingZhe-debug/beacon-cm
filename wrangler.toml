name = "beacon-cm"
main = "_worker.js"
compatibility_date = "2025-11-04"
# 【必加】解决 node:crypto 警告，不加会白屏
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[vars]
# 【警告】强烈建议改成你新想的密码，这个已经泄露了
ADMIN = "548766"

[[kv_namespaces]]
binding = "KV"
# 【改好了】换成你提供的 KV ID
id = "5aa3cb6bf8f740e4828c93db9a2f42b0"

[[d1_databases]]
binding = "DB"
# 【改好了】改成你的数据库名字（jingzhe）
database_name = "jingzhe"
# 【改好了】换成你提供的 D1 ID
database_id = "f1b1fba9-1b02-42c5-96a2-004a89e1eaee"

# 【重要修正】triggers 必须用单方括号 [triggers]，不能用 [[triggers]]，否则会报错
[triggers]
crons = ["0 */6 * * *"]
